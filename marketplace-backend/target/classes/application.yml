server:
  port: 8080

spring:
  application:
    name: marketplace
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/marketplace_db}
    username: ${DB_USER:marketplace_user}
    password: ${DB_PASS:marketplace_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    secret: ${JWT_SECRET:tu-clave-secreta-de-minimo-256-bits-para-desarrollo-local}
    expiration: ${JWT_EXPIRATION:86400000}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%-5level] %msg%n"
  level:
    com.tuapp.marketplace: INFO
