<app-auth-layout>
  <main class="login">
    <div class="login__canvas">
      <!-- Brand Identity Section -->
      <section class="login__header">
        <div class="login__logo">
          <div class="login__logo-shadow"></div>
          <div class="login__logo-box">
            <i class="pi pi-shopping-cart login__logo-icon"></i>
          </div>
        </div>

        <h1 class="login__heading">WhatShop</h1>
        <p class="login__tagline">Bienvenido de nuevo</p>
      </section>

      <!-- Login Form -->
      <form [formGroup]="form" class="login__form" (ngSubmit)="onLogin()">
        <app-form-field
          formControlName="email"
          label="Correo electrónico"
          type="email"
          icon="pi-envelope"
          placeholder="tu@ejemplo.com"
          [required]="true"
          [invalid]="form.controls.email.touched && form.controls.email.invalid"
          [error]="errorFor(form.controls.email)"
        ></app-form-field>

        <div class="login__password-group">
          <app-form-field
            formControlName="password"
            label="Contraseña"
            type="password"
            icon="pi-lock"
            placeholder="••••••••"
            [eyeToggle]="true"
            [required]="true"
            [invalid]="form.controls.password.touched && form.controls.password.invalid"
            [error]="errorFor(form.controls.password)"
          ></app-form-field>

          <a class="login__forgot" href="#">¿Olvidaste tu contraseña?</a>
        </div>

        @if (error()) {
          <p class="login__error" role="alert">{{ error() }}</p>
        }

        <!-- Primary CTA -->
        <button class="login__button" type="submit" [disabled]="loading()">
          <span class="login__button-text">{{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}</span>
        </button>

        <!-- Divider -->
        <div class="login__divider">
          <span class="login__divider-line"></span>
          <span class="login__divider-text">o</span>
          <span class="login__divider-line"></span>
        </div>

        <!-- Social Auth -->
        <button class="login__google" type="button">
          <svg class="login__google-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.77.43 3.44 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span class="login__google-text">Continuar con Google</span>
        </button>
      </form>

      <!-- Footer Links -->
      <footer class="login__footer">
        <span class="login__footer-text">¿No tienes cuenta?</span>
        <a class="login__footer-link" routerLink="/register">Regístrate</a>
      </footer>
    </div>

    <!-- Contextual Decorative Element -->
    <div class="login__accent"></div>
  </main>
</app-auth-layout>
