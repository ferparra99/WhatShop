<div class="splash">
  <!-- Fullscreen overlay -->
  <div class="splash__bg"></div>

  <!-- Blur decorativos -->
  <div class="splash__blur splash__blur--top"></div>
  <div class="splash__blur splash__blur--bottom"></div>

  <!-- Contenido central -->
  <div class="splash__content">
    <!-- Logo -->
    <div class="splash__logo">
      <div class="splash__logo-blur"></div>
      <div class="splash__logo-box">
        <div class="splash__logo-shadow"></div>
        <i class="pi pi-shopping-cart splash__logo-icon"></i>
      </div>
    </div>

    <!-- Título -->
    <h1 class="splash__title">WhatShop</h1>

    <!-- Subtítulo -->
    <p class="splash__tagline">Comprar y vender nunca fue tan fácil</p>
  </div>

  <!-- Barra de carga -->
  <div class="splash__loading">
    <div class="splash__progress">
      <div class="splash__progress-bar"></div>
    </div>

    <div class="splash__loading-label">
      <span class="splash__dot"></span>
      <span class="splash__loading-text">Cargando</span>
    </div>
  </div>

  <!-- Footer -->
  <span class="splash__footer">© 2026 WhatShop</span>
</div>
