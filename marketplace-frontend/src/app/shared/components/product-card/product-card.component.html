<article class="product-card">
  <div class="product-card__image-wrap">
    <img
      class="product-card__image"
      [src]="product().imageUrl"
      [alt]="product().name"
      loading="lazy"
    />
    <button class="product-card__fav" type="button" aria-label="Agregar a favoritos">
      <i class="pi pi-plus product-card__fav-icon"></i>
    </button>
  </div>

  <div class="product-card__body">
    <div class="product-card__rating">
      <i class="pi pi-star product-card__rating-icon"></i>
      <span class="product-card__rating-value">4.9</span>
    </div>

    <h3 class="product-card__name">{{ product().name }}</h3>
    <p class="product-card__store">{{ product().storeName }}</p>

    <p class="product-card__price">{{ formattedPrice }}</p>
  </div>
</article>
